<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>H&amp;S on Command · Owner</title>
<link rel="icon" href="../favicon-hs.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root {
  --ground: #ececec; --surface: #fff; --surface-2: #f3f3f3; --ink: #14181b; --ink-2: #48525a; --muted: #76818a; --line: #d6d6d6;
  --chrome: #15191c; --chrome-ink: #f3f5f6; --good: #1d8549; --good-bg: #e1f2e7; --warn: #a96400; --warn-bg: #fcefd6; --bad: #c42e2e; --bad-bg: #fae3e1;
  --r: 14px; --r-sm: 10px; --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --font-body: "Barlow", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #0e1113; --surface: #171b1e; --surface-2: #1f2428; --ink: #eef1f3; --ink-2: #bac2c8; --muted: #87929a; --line: #2c3338;
  --chrome: #090b0d; --good: #45c97b; --good-bg: #12301e; --warn: #f0a531; --warn-bg: #382810; --bad: #ff6b63; --bad-bg: #3a1715; color-scheme: dark; } }
:root[data-theme="dark"] { --ground: #0e1113; --surface: #171b1e; --surface-2: #1f2428; --ink: #eef1f3; --ink-2: #bac2c8; --muted: #87929a; --line: #2c3338;
  --chrome: #090b0d; --good: #45c97b; --good-bg: #12301e; --warn: #f0a531; --warn-bg: #382810; --bad: #ff6b63; --bad-bg: #3a1715; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.45 var(--font-body); }
header { background: var(--chrome); color: var(--chrome-ink); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
header img { width: 36px; height: 36px; border-radius: 8px; }
header b { font: 700 1.25rem var(--font-display); letter-spacing: .01em; display: block; }
header span { font-size: .8rem; opacity: .75; }
header .grow { flex: 1; }
main { max-width: 980px; margin: 0 auto; padding: 18px 16px 48px; display: grid; gap: 16px; }
h1 { font: 700 1.9rem/1.1 var(--font-display); margin: 4px 0 0; }
h2 { font: 700 1.35rem/1.15 var(--font-display); margin: 0; }
p { margin: 0; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 12px; }
.field { display: grid; gap: 6px; }
label { font-weight: 600; font-size: .9rem; }
input, textarea { font: inherit; color: inherit; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 11px 12px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.btn { font: 600 1rem var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 11px 16px; cursor: pointer; }
.btn.dark { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.sm { padding: 7px 12px; font-size: .9rem; }
.btn:disabled { opacity: .55; cursor: default; }
.link { background: none; border: 0; color: var(--ink-2); text-decoration: underline; font: inherit; cursor: pointer; padding: 0; }
.err { color: var(--bad); font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.kpi b { font: 700 1.8rem/1 var(--font-display); display: block; font-variant-numeric: tabular-nums; }
.kpi span { font-size: .82rem; color: var(--muted); }
.co { display: grid; gap: 10px; }
.co-h { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
.co-h .grow { flex: 1; min-width: 180px; }
.chip { display: inline-block; font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.good { background: var(--good-bg); color: var(--good); } .chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stats div { background: var(--surface-2); border-radius: var(--r-sm); padding: 8px 10px; }
.stats b { font: 700 1.3rem/1.1 var(--font-display); display: block; font-variant-numeric: tabular-nums; }
.stats span { font-size: .78rem; color: var(--muted); }
.sw { position: relative; width: 46px; height: 28px; border-radius: 99px; background: var(--line); flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.sw.on { background: var(--good); } .sw.on::after { transform: translateX(18px); }
.toggle { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; text-align: left; }
.signin { max-width: 420px; margin: 8vh auto 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
@media (max-width: 520px) { main { padding: 14px 16px 40px; } h1 { font-size: 1.6rem; } }
</style>
</head>
<body>
<header><img src="../icon-hs-192.png" alt=""><div class="grow"><b>H&amp;S on Command</b><span>Owner · companies and usage</span></div><button class="link" id="out" hidden style="color:var(--chrome-ink)">Sign out</button></header>
<main id="main"></main>
<script src="../config.js"></script>
<script>
(() => {
const C = window.HS_CONFIG || {}, main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'hsoc-owner-tok';
let tok = ''; try { tok = sessionStorage.getItem(KEY) || ''; } catch {}
let state = { mode: tok ? 'list' : 'login', err: '', list: null, edit: null };
async function call(fn, args) {
  const h = { apikey: C.supabaseKey, 'Content-Type': 'application/json', 'Content-Profile': 'hsdir' };
  if (/^eyJ/.test(C.supabaseKey || '')) h.Authorization = 'Bearer ' + C.supabaseKey;
  const r = await fetch(String(C.supabaseUrl || '').replace(/\/$/, '') + '/rest/v1/rpc/' + fn, { method: 'POST', headers: h, body: JSON.stringify(args || {}) });
  if (!r.ok) { const e = new Error(fn + ' ' + r.status); e.status = r.status; throw e; }
  const t = await r.text(); return t ? JSON.parse(t) : null;
}
const setTok = t => { tok = t || ''; try { tok ? sessionStorage.setItem(KEY, tok) : sessionStorage.removeItem(KEY); } catch {} };
const when = d => { if (!d) return 'never'; const t = new Date(d), m = (Date.now() - t) / 60000;
  if (m < 2) return 'just now'; if (m < 60) return Math.round(m) + ' min ago'; if (m < 1440) return Math.round(m / 60) + ' h ago'; if (m < 2880) return 'yesterday';
  return t.toLocaleDateString('en-ZA', { day: 'numeric', month: 'short', year: 'numeric' }); };
const KIND = { live: ['Client', 'good'], demo: ['Demo', 'warn'], test: ['Test', ''] };
const ERR = { wrong: 'That is not right.', locked: 'Too many wrong tries. Wait 15 minutes.', pin: 'Choose a PIN of 6 to 12 digits.', setup: 'No owner PIN yet. Use your one-time set-up code.' };

function view() {
  document.getElementById('out').hidden = state.mode !== 'list';
  if (state.mode === 'login' || state.mode === 'setup') {
    const setup = state.mode === 'setup';
    main.innerHTML = `<section class="signin card"><h1>${setup ? 'First sign-in' : 'Owner sign-in'}</h1>
      <p class="muted small">${setup ? 'Enter the one-time set-up code you were given and choose your owner PIN (6 to 12 digits). The code stops working once your PIN is set.' : 'Usage counts and the on/off switch for every company. You never see a company’s staff or records here.'}</p>
      <form id="f" class="co" autocomplete="off">
        ${setup ? '<div class="field"><label for="setup">One-time set-up code</label><input id="setup" autocapitalize="characters" spellcheck="false"></div>' : ''}
        <div class="field"><label for="pin">${setup ? 'Choose your owner PIN' : 'Owner PIN'}</label><input id="pin" type="password" inputmode="numeric" autocomplete="${setup ? 'new-password' : 'current-password'}"></div>
        ${state.err ? `<p class="err small" role="alert">${esc(state.err)}</p>` : ''}
        <button class="btn dark" type="submit">${setup ? 'Set PIN and sign in' : 'Sign in'}</button>
      </form>
      <button class="link small" id="swap">${setup ? 'I already have an owner PIN' : 'First time? Use the set-up code'}</button></section>`;
    document.getElementById('swap').onclick = () => { state.mode = setup ? 'login' : 'setup'; state.err = ''; view(); };
    document.getElementById('f').onsubmit = async e => { e.preventDefault(); const b = e.target.querySelector('button'); b.disabled = true; state.err = '';
      try { const r = setup ? await call('hs_owner_setup', { setup: document.getElementById('setup').value.trim(), pin: document.getElementById('pin').value.trim() }) : await call('hs_owner_login', { pin: document.getElementById('pin').value.trim() });
        if (r && r.token) { setTok(r.token); state.mode = 'list'; load(); return; }
        state.err = ERR[r && r.error] || 'Could not sign in.'; if (r && r.error === 'setup') state.mode = 'setup'; }
      catch { state.err = 'Could not reach the server. Check your connection.'; }
      view(); };
    return;
  }
  if (!state.list) { main.innerHTML = '<p class="muted">Loading…</p>'; return; }
  const L = state.list, live = L.filter(c => c.kind === 'live');
  const sum = k => live.reduce((t, c) => t + (c[k] || 0), 0);
  main.innerHTML = `<div><p class="muted small">${new Date().toLocaleDateString('en-ZA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p><h1>Companies</h1></div>
    <div class="kpis">
      <div class="kpi"><b>${live.filter(c => c.active).length}</b><span>client companies switched on${live.some(c => !c.active) ? ` · ${live.filter(c => !c.active).length} off` : ''}</span></div>
      <div class="kpi"><b>${sum('staff')}</b><span>staff in client companies</span></div>
      <div class="kpi"><b>${sum('phones7')}</b><span>phones used in the last 7 days</span></div>
      <div class="kpi"><b>${sum('records30')}</b><span>records logged in the last 30 days</span></div>
    </div>
    ${L.map(c => { const k = KIND[c.kind] || ['', ''], ed = state.edit === c.sect;
      return `<section class="card co"><div class="co-h"><div class="grow"><h2>${esc(c.label)}</h2><p class="muted small">${esc(c.name || '')}${c.name && c.name !== c.label ? ' · ' : ''}section ${esc(c.sect)} · since ${esc(new Date(c.created).toLocaleDateString('en-ZA', { month: 'short', year: 'numeric' }))}</p></div>
        <span class="chip ${k[1]}">${k[0]}</span>
        <button class="toggle" data-sw="${esc(c.sect)}" ${c.switchWorks ? '' : 'disabled title="Switch works once this company is on database version 8"'}><span class="chip ${c.active ? 'good' : 'bad'}">${c.active ? 'On' : 'Off'}</span><span class="sw ${c.active ? 'on' : ''}" aria-hidden="true"></span><span class="sr" style="position:absolute;left:-9999px">Switch ${esc(c.label)} ${c.active ? 'off' : 'on'}</span></button></div>
        ${c.note && !ed ? `<p class="small">${esc(c.note)}</p>` : ''}
        ${!c.switchWorks ? '<p class="muted small">The on/off switch takes effect once this company is on database version 8.</p>' : ''}
        ${state.confirm === c.sect ? `<div class="card" style="background:var(--bad-bg);border-color:transparent"><p class="small"><b>Switch ${esc(c.label)} off?</b> Their staff can no longer open the app until you switch it on again. Nothing is deleted.</p><div class="row"><button class="btn dark sm" data-off="${esc(c.sect)}">Switch off</button><button class="btn sm" data-cancel="1">Cancel</button></div></div>` : ''}
        <div class="stats">
          <div><b>${c.staff ?? '–'}</b><span>staff</span></div><div><b>${c.sites ?? '–'}</b><span>sites</span></div>
          <div><b>${c.phones ?? '–'}</b><span>phones ever · ${c.installed ?? 0} on home screen</span></div><div><b>${c.phones7 ?? '–'}</b><span>phones in the last 7 days</span></div>
          <div><b>${c.records30 ?? '–'}</b><span>records in 30 days · ${c.records7 ?? 0} in 7</span></div><div><b>${c.pins ?? '–'}</b><span>PINs set</span></div>
        </div>
        <p class="muted small">Last used ${esc(when(c.lastOpen))} · last record ${esc(when(c.lastRecord))}${c.switchedAt ? ' · switched ' + (c.active ? 'on' : 'off') + ' ' + esc(when(c.switchedAt)) : ''}</p>
        ${ed ? `<div class="field"><label for="lb-${esc(c.sect)}">Your name for this company</label><input id="lb-${esc(c.sect)}" value="${esc(c.label)}"></div>
          <div class="field"><label for="nt-${esc(c.sect)}">Your note (plan, fee, contact)</label><textarea id="nt-${esc(c.sect)}">${esc(c.note || '')}</textarea></div>
          <div class="row"><button class="btn dark sm" data-save="${esc(c.sect)}">Save</button><button class="btn sm" data-cancel="1">Cancel</button></div>`
          : `<div><button class="link small" data-edit="${esc(c.sect)}">Edit name and note</button></div>`}
      </section>`; }).join('')}
    <p class="muted small">Counts only. Names, records, photos and documents stay inside each company’s own space. Updated ${esc(when(state.at))} · <button class="link small" id="re">Refresh</button></p>`;
  main.querySelectorAll('[data-sw]').forEach(b => b.onclick = () => { const c = L.find(x => x.sect === b.dataset.sw); if (c.active) { state.confirm = c.sect; view(); } else flip(c.sect, true); });
  main.querySelectorAll('[data-off]').forEach(b => b.onclick = () => flip(b.dataset.off, false));
  main.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { state.confirm = null; state.edit = null; view(); });
  main.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { state.edit = b.dataset.edit; view(); });
  main.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => { const s = b.dataset.save; b.disabled = true;
    try { await call('hs_owner_note', { tok, sect: s, label: document.getElementById('lb-' + s).value, note: document.getElementById('nt-' + s).value }); state.edit = null; load(); }
    catch (e) { if (e.status === 401 || e.status === 403) return signOut(); b.textContent = 'Could not save: the name needs at least 2 letters'; b.disabled = false; } });
  document.getElementById('re').onclick = load;
}
async function flip(sect, on) {
  state.confirm = null;
  try { await call('hs_owner_switch', { tok, sect, active: on }); } catch (e) { if (e.status === 401 || e.status === 403) return signOut(); }
  load();
}
async function load() {
  try { state.list = await call('hs_owner_overview', { tok }); state.at = new Date(); }
  catch (e) { if (e.status === 401 || e.status === 403 || e.status === 400) return signOut(); state.list = state.list || []; }
  view();
}
function signOut() { if (tok) call('hs_owner_logout', { tok }).catch(() => {}); setTok(''); state = { mode: 'login', err: '', list: null }; view(); }
document.getElementById('out').onclick = signOut;
view(); if (tok) load();
})();
</script>
</body>
</html>
