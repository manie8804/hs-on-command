<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#15191c"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="apple-mobile-web-app-title" content="H&amp;S Command"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon-hs.png"><link rel="icon" type="image/png" href="favicon-hs.png"><title>H&amp;S on Command</title><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><script>try{var t=JSON.parse(localStorage.getItem("hsoc-theme"));if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script><script src="config.js"></script></head><body><title>H&amp;S on Command</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout concept: a site phone in a hi-vis world — concrete ground, black chrome with one strip of hazard tape,
   signage yellow only on the one action that matters (scan / submit); traffic-light status everywhere else.
   On a wide screen the phone sits beside the live office view. */
:root {
  --ground: #ececec;
  --surface: #ffffff;
  --surface-2: #f3f3f3;
  --ink: #14181b;
  --ink-2: #48525a;
  --muted: #76818a;
  --line: #d6d6d6;
  --chrome: #15191c;
  --chrome-ink: #f3f5f6;
  --chrome-2: #262c31;
  --hivis: #14181b;
  --hivis-ink: #ffffff;
  --good: #1d8549; --good-bg: #e1f2e7;
  --warn: #a96400; --warn-bg: #fcefd6;
  --bad: #c42e2e;  --bad-bg: #fae3e1;
  --bezel: #0b0d0f;
  --shadow: 0 10px 30px rgba(20,24,27,.12);
  --shadow-sm: 0 1px 2px rgba(20,24,27,.08), 0 2px 8px rgba(20,24,27,.05);
  --r: 14px; --r-sm: 10px;
  --font-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0e1113; --surface: #171b1e; --surface-2: #1f2428; --ink: #eef1f3; --ink-2: #bac2c8; --muted: #87929a; --line: #2c3338;
    --chrome: #090b0d; --chrome-ink: #eef1f3; --chrome-2: #1c2125; --hivis: #f3f5f6; --hivis-ink: #111416;
    --good: #45c97b; --good-bg: #12301e; --warn: #f0a531; --warn-bg: #382810; --bad: #ff6b63; --bad-bg: #3a1715;
    --bezel: #000000; --shadow: 0 10px 30px rgba(0,0,0,.45); --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0e1113; --surface: #171b1e; --surface-2: #1f2428; --ink: #eef1f3; --ink-2: #bac2c8; --muted: #87929a; --line: #2c3338;
  --chrome: #090b0d; --chrome-ink: #eef1f3; --chrome-2: #1c2125; --hivis: #f3f5f6; --hivis-ink: #111416;
  --good: #45c97b; --good-bg: #12301e; --warn: #f0a531; --warn-bg: #382810; --bad: #ff6b63; --bad-bg: #3a1715;
  --bezel: #000000; --shadow: 0 10px 30px rgba(0,0,0,.45); --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--chrome); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: 1.85rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.12rem; text-transform: uppercase; letter-spacing: .04em; }
p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; width: 100%; }
textarea { min-height: 84px; resize: vertical; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible, label:focus-visible { outline: 3px solid var(--hivis); outline-offset: 2px; }
.eyebrow { font-size: .74rem; font-weight: 700; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.mono { font-family: var(--font-mono); font-size: .78rem; letter-spacing: .02em; }
.num { font-variant-numeric: tabular-nums; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.ic { width: 22px; height: 22px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- stage: phone + office pane ---------- */
.stage { height: 100%; display: grid; grid-template-columns: 1fr; }
.phone { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--ground); overflow: hidden; min-width: 0; }
#officePane { display: none; }
@media (min-width: 1000px) {
  .stage { grid-template-columns: 420px minmax(0, 1fr); gap: 28px; padding-block: 22px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); max-width: 1440px; margin: 0 auto; }
  .phone { border: 10px solid var(--bezel); border-radius: 38px; box-shadow: var(--shadow); max-height: 920px; align-self: center; }
  #officePane { display: block; overflow-y: auto; min-width: 0; padding-right: 6px; }
  .nav button[data-tab="office"] { display: none; }
  .stage.no-office { grid-template-columns: 420px; justify-content: center; }
  .stage.no-office #officePane { display: none; }
}

/* ---------- top chrome ---------- */
.top { flex: none; background: var(--chrome); color: var(--chrome-ink); padding-block: 10px 0; }
.top-row { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; }
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand img { width: 50px; height: 36px; object-fit: contain; flex: none; }
.brand b { font-family: var(--font-display); font-size: 1.18rem; letter-spacing: .01em; display: block; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { font-size: .72rem; color: color-mix(in srgb, var(--chrome-ink) 62%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--chrome-2); font-size: .76rem; font-weight: 600; white-space: nowrap; }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.pill.live i { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 30%, transparent); }
.pill.wait i { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
.pill.busy i { background: var(--chrome-ink); animation: pulse .8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.iconbtn { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.top .iconbtn:hover { background: var(--chrome-2); }
.bell { position: relative; }
.bell .badge { position: absolute; top: 1px; right: -1px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .66rem; font-weight: 700; display: grid; place-items: center; line-height: 1; border: 2px solid var(--chrome); box-sizing: border-box; }
.li.unread .t::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 7px; vertical-align: middle; }
.toggle.card { border-radius: var(--r); }
.newdot { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: .72rem; font-weight: 700; display: inline-grid; place-items: center; flex: none; box-sizing: border-box; }
.divh .chev { display: grid; color: var(--muted); flex: none; } .divh .chev .ic { transition: transform .15s; } .divh[aria-expanded="true"] .chev .ic { transform: rotate(180deg); }
.divsites .li { padding-left: 30px; background: var(--surface-2); }
.li.lvl[disabled] { opacity: .5; cursor: not-allowed; }
.dsstep { margin: 14px 0 0; } .dsstep h3 { display: flex; align-items: center; gap: 8px; }
.stepno { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: .78rem; font-weight: 700; flex: none; }
details.swp summary { cursor: pointer; list-style: none; } details.swp summary::-webkit-details-marker { display: none; } details.swp ol { margin: 6px 0 0 18px; display: grid; gap: 4px; }
.todo.solo { border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); }
.misschip { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; } .li.lvl.on { box-shadow: inset 3px 0 0 var(--good); }
.tape { height: 1px; background: var(--chrome-2); }
.demo { flex: none; display: flex; align-items: center; gap: 10px; padding-block: 8px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: .82rem; color: var(--ink-2); }
.demo b { color: var(--ink); }
.demo .x { margin-left: auto; color: var(--muted); font-weight: 700; padding: 4px 8px; border-radius: 8px; }
.viewonly { flex: none; padding-block: 8px; background: var(--warn-bg); color: var(--warn); font-size: .84rem; font-weight: 600; }

/* ---------- main + nav ---------- */
main { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.page { padding-block: 18px 28px; display: flex; flex-direction: column; gap: 18px; }
.nav { flex: none; display: flex; justify-content: space-around; align-items: flex-end; background: var(--surface); border-top: 1px solid var(--line); padding-block: 6px 8px; }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .7rem; font-weight: 600; color: var(--muted); padding: 4px 6px; border-radius: 10px; min-width: 58px; }
.nav button.on { color: var(--ink); }
.nav button.on .ic { stroke-width: 2.3; }
.nav .scanbtn { margin-top: -22px; }
.nav .scanbtn .disc { width: 58px; height: 58px; border-radius: 50%; background: var(--hivis); color: var(--hivis-ink); display: grid; place-items: center; box-shadow: 0 4px 14px rgba(0,0,0,.22); border: 4px solid var(--surface); }
.nav .scanbtn .disc .ic { width: 26px; height: 26px; stroke-width: 2.2; }
.nav .scanbtn.on { color: var(--ink); }

/* ---------- buttons / chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: .98rem; background: var(--surface-2); color: var(--ink); border: 1.5px solid var(--line); text-align: center; }
.btn:active { transform: scale(.985); }
.btn.hivis { background: var(--hivis); color: var(--hivis-ink); border-color: transparent; }
.btn.dark { background: var(--ink); color: var(--surface); border-color: transparent; }
.btn.good { background: var(--good); color: #fff; border-color: transparent; }
.btn.bad { background: var(--bad); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: .88rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 700; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.todo { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.todo:first-child { border-top: 0; }
.todo .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: transparent; }
.todo.done .box { background: var(--good); border-color: var(--good); color: #fff; }
.todo .box .ic { width: 18px; height: 18px; stroke-width: 3; }
.signin { padding-block: 28px 32px; display: flex; flex-direction: column; gap: 16px; }
.signin .hero { background: var(--chrome); color: var(--chrome-ink); border-radius: var(--r); padding: 22px 18px; display: flex; flex-direction: column; gap: 10px; }
.signin .hero img { width: 92px; height: auto; }
.signin .hero p { color: color-mix(in srgb, var(--chrome-ink) 72%, transparent); font-size: .92rem; }
.rowbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.banner { background: var(--warn-bg); color: var(--warn); border-radius: var(--r-sm); padding: 10px 12px; font-size: .88rem; font-weight: 600; }
.banner.info { background: var(--surface-2); color: var(--ink-2); }
.lstext { min-height: 150px; font-size: .92rem; line-height: 1.5; }
.tplbox { background: var(--surface-2); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.addrow { display: flex; gap: 8px; } .addrow input { flex: 1; min-width: 0; }
.chk { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
.chk:first-child { border-top: 0; } .chk input { width: 20px; height: 20px; flex: none; }
.chip.pend { background: var(--warn-bg); color: var(--warn); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { padding: 8px 13px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-size: .9rem; color: var(--ink-2); }
.seg button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ---------- cards / lists ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 16px; }
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); overflow: hidden; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.li:first-child { border-top: 0; }
button.li:hover { background: var(--surface-2); }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.li .s { font-size: .82rem; color: var(--muted); }
.av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 1rem; background: var(--surface-2); color: var(--ink-2); flex: none; border: 2px solid transparent; }
.av.good { border-color: var(--good); } .av.warn { border-color: var(--warn); } .av.bad { border-color: var(--bad); }
.typeic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); flex: none; }
.typeic.incident { background: var(--bad-bg); color: var(--bad); }
.typeic.check { background: var(--good-bg); color: var(--good); }
.empty { padding: 22px 16px; text-align: center; color: var(--muted); font-size: .92rem; background: var(--surface); border-radius: var(--r); border: 1.5px dashed var(--line); }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.link { font-weight: 700; font-size: .86rem; text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); }

/* ---------- home ---------- */
.sitecard { background: var(--chrome); color: var(--chrome-ink); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow-sm); }
.sitecard .eyebrow { color: color-mix(in srgb, var(--chrome-ink) 60%, transparent); }
.sitecard .sub { font-size: .84rem; color: color-mix(in srgb, var(--chrome-ink) 70%, transparent); margin-top: 3px; }
.sitecard .switch { color: var(--chrome-ink); border: 1.5px solid var(--chrome-2); background: var(--chrome-2); }
.bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; background: var(--chrome-2); gap: 2px; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--good); } .bar .w { background: var(--warn); } .bar .b { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.cover { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cover div { background: var(--chrome-2); border-radius: 10px; padding: 8px 10px; }
.cover b { font-family: var(--font-display); font-size: 1.35rem; display: block; line-height: 1.1; }
.cover span { font-size: .74rem; color: color-mix(in srgb, var(--chrome-ink) 70%, transparent); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; text-align: left; min-height: 104px; border: 1.5px solid transparent; }
.tile:hover { border-color: var(--line); }
.tile b { font-family: var(--font-display); font-size: 1.15rem; line-height: 1.05; }
.tile .s { font-size: .78rem; color: var(--muted); margin-top: 2px; display: block; }
.tile .ic { width: 26px; height: 26px; }
.tile.primary { background: var(--hivis); color: var(--hivis-ink); grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 14px; }
.tile.primary .s { color: color-mix(in srgb, var(--hivis-ink) 70%, transparent); }
.tile.wide { grid-column: 1 / -1; min-height: 0; flex-direction: row; align-items: center; gap: 14px; }
.phk.k-unsafe { border-color: var(--bad-bg); }
.phk.k-unsafe .ic { color: var(--bad); }
.rthumb { width: 38px; height: 38px; border-radius: 10px; object-fit: cover; flex: none; background: var(--surface-2); }
.phgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.phtile { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--surface-2); text-align: left; padding: 0; }
.phtile img, .phtile .ph { width: 100%; height: 100%; object-fit: cover; display: block; }
.phtile .cap { position: absolute; inset: auto 0 0 0; padding: 14px 6px 5px; font-size: .7rem; line-height: 1.2; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.72)); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.jobcard { display: flex; flex-direction: column; gap: 10px; }
.stagecol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stagecol .lab { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.stagecol .phtile.none { display: grid; place-items: center; color: var(--muted); font-size: .75rem; border: 1.5px dashed var(--line); background: none; }
.phcap { margin-top: 8px; padding: 10px 12px; background: var(--surface-2); border-radius: var(--r-sm); white-space: pre-wrap; }
.gallerylink { align-self: flex-start; margin-top: 6px; }

/* ---------- scan ---------- */
.viewfinder { position: relative; aspect-ratio: 1 / 1; max-width: 100%; width: 100%; max-height: 300px; margin: 0 auto; border-radius: var(--r); background: var(--chrome); display: grid; place-items: center; overflow: hidden; }
.viewfinder::before { content: ""; position: absolute; inset: 22%; background:
  linear-gradient(#ffffff, #ffffff) top left / 34px 4px no-repeat, linear-gradient(#ffffff, #ffffff) top left / 4px 34px no-repeat,
  linear-gradient(#ffffff, #ffffff) top right / 34px 4px no-repeat, linear-gradient(#ffffff, #ffffff) top right / 4px 34px no-repeat,
  linear-gradient(#ffffff, #ffffff) bottom left / 34px 4px no-repeat, linear-gradient(#ffffff, #ffffff) bottom left / 4px 34px no-repeat,
  linear-gradient(#ffffff, #ffffff) bottom right / 34px 4px no-repeat, linear-gradient(#ffffff, #ffffff) bottom right / 4px 34px no-repeat; }
.viewfinder .line { position: absolute; left: 24%; right: 24%; height: 2px; background: #ffffff; box-shadow: 0 0 12px #ffffff; top: 30%; animation: sweep 2.4s ease-in-out infinite alternate; }
@keyframes sweep { to { top: 70%; } }
.viewfinder .ic { width: 56px; height: 56px; stroke: color-mix(in srgb, var(--chrome-ink) 55%, transparent); stroke-width: 1.4; }
.viewfinder.busy .ic { animation: pulse .7s infinite; }

/* ---------- worker sheet ---------- */
.verdict { border-radius: var(--r); padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
.verdict.good { background: var(--good); color: #fff; }
.verdict.warn { background: var(--warn); color: #fff; }
.verdict.bad { background: var(--bad); color: #fff; }
.verdict .big { font-family: var(--font-display); font-size: 1.7rem; line-height: 1; letter-spacing: .02em; }
.verdict ul { margin: 8px 0 0; padding-left: 18px; font-size: .92rem; }
.verdict .ic { width: 34px; height: 34px; stroke-width: 2.4; }
.req { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 11px 14px; border-top: 1px solid var(--line); }
.req:first-child { border-top: 0; }
.req .n { font-weight: 600; }
.req .d { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); }
.qrbox { background: #fff; color: #111; border-radius: var(--r); padding: 14px; display: flex; gap: 14px; align-items: center; border: 1.5px solid var(--line); }
.qrbox img { width: 132px; height: 132px; image-rendering: pixelated; flex: none; }
.qrbox b { font-family: var(--font-display); font-size: 1.2rem; display: block; }
.qrbox .mono { color: #333; }
.qrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.qrcard { background: #fff; color: #111; border-radius: 12px; padding: 10px; text-align: center; border: 1.5px solid #d9dde0; }
.qrcard img { width: 100%; max-width: 150px; image-rendering: pixelated; }
.qrcard b { display: block; font-weight: 700; font-size: .9rem; }
.qrcard span { font-size: .72rem; color: #444; }

/* ---------- flows ---------- */
.flowbar { position: sticky; top: 0; z-index: 3; background: var(--ground); display: flex; align-items: center; gap: 8px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.flowbar h2 { font-size: 1.25rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tpls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tpl { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 14px; text-align: left; display: flex; flex-direction: column; gap: 10px; border: 1.5px solid transparent; }
.tpl:hover { border-color: var(--line); }
.tpl b { font-family: var(--font-display); font-size: 1.1rem; line-height: 1.1; }
.qitem { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; border-left: 5px solid var(--line); }
.qitem.pass { border-left-color: var(--good); }
.qitem.fail { border-left-color: var(--bad); }
.qitem.na { border-left-color: var(--muted); }
.qitem .q { font-weight: 600; overflow-wrap: anywhere; }
.pfn { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pfn button { padding: 9px 4px; border-radius: 10px; border: 1.5px solid var(--line); font-weight: 700; font-size: .9rem; background: var(--surface); color: var(--ink-2); }
.pfn button.on.pass { background: var(--good); border-color: var(--good); color: #fff; }
.pfn button.on.fail { background: var(--bad); border-color: var(--bad); color: #fff; }
.pfn button.on.na { background: var(--ink-2); border-color: var(--ink-2); color: var(--surface); }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
.thumbs img, .thumbs .ph { width: 76px; height: 76px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.thumbs.lg img, .thumbs.lg .ph { width: 100%; height: auto; max-height: 340px; object-fit: contain; background: #000; }
.addph { width: 76px; height: 76px; border-radius: 10px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); background: var(--surface); }
.sigbox { background: #fff; border: 1.5px dashed #b9c0c5; border-radius: 12px; min-height: 92px; display: grid; place-items: center; color: #6b757c; font-weight: 600; width: 100%; }
.sigbox img { max-height: 86px; max-width: 100%; }
.sigmini { height: 34px; max-width: 110px; background: #fff; border-radius: 6px; border: 1px solid var(--line); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lab { font-weight: 700; font-size: .86rem; }
.submitbar { position: sticky; bottom: 0; background: linear-gradient(to top, var(--ground) 72%, transparent); padding-block: 14px 6px; display: flex; flex-direction: column; gap: 6px; }
.progress { font-size: .84rem; color: var(--muted); text-align: center; }
.attn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); }
.attn:first-child { border-top: 0; }

/* ---------- sheet ---------- */
.sheet-wrap { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(8,10,12,.5); animation: fade .18s ease-out; }
.sheet { background: var(--ground); border-radius: 20px 20px 0 0; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; animation: rise .24s cubic-bezier(.2,.8,.2,1); padding-bottom: 18px; }
.sheet-h { position: sticky; top: 0; z-index: 2; background: var(--ground); display: flex; align-items: center; gap: 10px; padding-block: 14px 10px; }
.sheet-h h2 { flex: 1; min-width: 0; font-size: 1.3rem; }
.grab { width: 42px; height: 5px; border-radius: 999px; background: var(--line); margin: 8px auto 0; }
.sheet-body { display: flex; flex-direction: column; gap: 14px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
canvas.pad { width: 100%; height: 190px; background: #fff; border-radius: 12px; border: 1.5px solid #c7ced3; touch-action: none; display: block; }
.toggle { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; }
.sw { width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.sw.on { background: var(--good); }
.sw.on::after { transform: translateX(18px); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

/* ---------- toast ---------- */
.toast { position: absolute; left: 50%; bottom: 92px; transform: translate(-50%, 16px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .92rem; opacity: 0; pointer-events: none; transition: .22s; z-index: 40; width: max-content; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- office ---------- */
.office { display: flex; flex-direction: column; gap: 16px; padding-block: 4px 24px; }
.office-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.office-h h1 { font-size: 2.1rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 14px; }
.kpi b { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; display: block; }
.kpi span { font-size: .8rem; color: var(--muted); font-weight: 600; }
.kpi.alert b { color: var(--bad); }
.ogrid { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 1250px) { .ogrid { grid-template-columns: 1fr 1fr; } }
.ocard { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-sm); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.osite { display: flex; flex-direction: column; gap: 6px; }
.osite .bar { background: var(--surface-2); }
.feed { display: flex; flex-direction: column; }
.feed .li { padding-inline: 0; }
.new { animation: flash 2.4s ease-out; }
@keyframes flash { 0% { background: color-mix(in srgb, var(--hivis) 45%, transparent); } 100% { background: transparent; } }

@media (max-width: 360px) { .actions, .tpls { grid-template-columns: 1fr; } h1 { font-size: 1.6rem; } }
@media (max-width: 440px) { .top .pill { padding: 9px; } .top .pill span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

async function getPhoto(id) {
  if (photoCache[id]) return photoCache[id];
  const ob = state.outbox.flatMap(e => e.photos).find(p => p.id === id);
  if (ob) return (photoCache[id] = ob.dataUrl);
  if (state.mode === 'supa') { try { const d = await rpc('hs_photo', { pid: id, tok: state.tok || null }); if (d) return (photoCache[id] = d); } catch {} return null; }
  if (!db) return null;
  try { const s = await db.doc('photos/' + id).get(); if (s.exists) return (photoCache[id] = s.data().dataUrl); } catch {}
  return null;
}
async function patchRecord(rec, patch) {
  if (rec.local) {
    const i = state.localRecs.findIndex(r => r.id === rec.id);
    if (i > -1) { state.localRecs[i] = { ...state.localRecs[i], ...patch }; store.set('sheq-local', state.localRecs); }
    onData(); return;
  }
  if (rec.pending) { toast('This record is still waiting for signal.'); return; }
  if (state.mode === 'supa') { try { await rpc('hs_patch_record', { tok: state.tok, rid: rec.id, patch: { ...patch, updatedAt: new Date().toISOString() } }); await pullRecords(); } catch { toast('Could not update. Check your signal and try again.'); } return; }
  if (!db) return;
  try { await db.doc('records/' + rec.id).update(patch); } catch { toast('Could not update. Check your signal and try again.'); }
}

function recordRow(r, opts = {}) {

  if (r.type === 'toolbox') { icon = 'talk'; sub = `${(r.attendees || []).length} signed`; }
  if (r.type === 'dsti') { sub = r.v === 2 ? `${(r.attendees || []).length + (r.late || []).length} signed · risk ${riskBand(r.risk.r).t.toLowerCase()}` : `${(r.attendees || []).length} signed · ${(r.hazards || []).length} hazards`; }
  if (r.type === 'incident') { icon = 'alert'; cls = 'incident'; sub = (r.description || '').slice(0, 60); }
  if (r.type === 'check') { icon = 'user'; cls = 'check'; sub = r.decision || ''; }
  if (r.type === 'photo') { const k = PHOTO_KIND[r.kind] || PHOTO_KIND.other; icon = k.ic; cls = r.kind === 'unsafe' ? 'incident' : ''; sub = (r.note || r.docType || k.name).slice(0, 60); }
